    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Outfit', sans-serif;
            background: #f5f5f7;
        }
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.7s ease;
        }
        .spinner {
            width: 44px; height: 44px; border: 4px solid rgba(0, 113, 227, 0.2); 
            border-top: 4px solid #0071e3;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #welcome-msg { margin-top: 24px; font-size: 1.25rem; font-weight: 600; color: #1d1d1f; display: none; }
        #login-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 9000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 20px; padding: 40px; width: 320px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12); text-align: center;
        }
        .login-box h2 {
            margin: 20px 0 24px 0; font-size: 22px; color: #1d1d1f; font-weight: 700; display: flex; align-items: center; justify-content: center;
        }
        .beta-badge {
            background: #fef08a; color: #a16207; font-size: 11px; font-weight: 700;
            padding: 4px 8px; border-radius: 8px; margin-left: 8px; letter-spacing: 0.5px;
        }
        select, input {
            width: 100%; padding: 14px; margin-bottom: 16px;
            border: 1px solid #d2d2d7; border-radius: 12px;
            font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500;
            box-sizing: border-box; background: #fff; outline: none; transition: all 0.2s;
        }
        select:focus, input:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }
        button {
            width: 100%; padding: 14px; background: #0071e3; color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; font-family: 'Outfit', sans-serif; transition: 0.2s;
        }
        button:hover:not(:disabled) { background: #005bb5; transform: translateY(-1px); }
        button:disabled { background: #a1a1aa; cursor: not-allowed; }
        .error-msg { color: #dc2626; font-size: 13px; font-weight: 600; margin-bottom: 15px; display: none; }
        .expired-msg { color: #dc2626; font-size: 14px; font-weight: 700; margin-bottom: 15px; display: none; }
    </style>
</head>

        } else {

        }

    function checkSession() {
        const sessionTime = localStorage.getItem('ns_gg_session_time');
        const sessionUser = localStorage.getItem('ns_gg_session_user');
        if (sessionTime && sessionUser) {
            const now = new Date().getTime();
            if (now - parseInt(sessionTime) < 86400000) { // Sessione valida per 24h
                const firstName = sessionUser.split(" ")[0];
                document.getElementById('welcome-msg').innerText = "Bentornato, " + firstName + "!";
                document.getElementById('welcome-msg').style.display = 'block';
                setTimeout(() => { loadApp(); }, 4000);
                return;
            }
        }
        showLogin();
    }
    
    function showLogin() {
        const loader = document.getElementById('loader-overlay');
        const login = document.getElementById('login-container');
        loader.style.opacity = '0';
        setTimeout(() => {
            loader.style.display = 'none';
            login.style.pointerEvents = 'auto';
            login.style.opacity = '1';
        }, 700);
    }
    
    function attemptLogin() {
        const user = document.getElementById('user-select').value;
        const pass = document.getElementById('password-input').value;
        if (user && users[user] === btoa(pass)) {
            localStorage.setItem('ns_gg_session_time', new Date().getTime().toString());
            localStorage.setItem('ns_gg_session_user', user);
            document.getElementById('login-container').style.opacity = '0';
            document.getElementById('loader-overlay').style.display = 'flex';
            const firstName = user.split(" ")[0];
            document.getElementById('welcome-msg').innerText = "Accesso in corso, " + firstName + "...";
            document.getElementById('welcome-msg').style.display = 'block';
            setTimeout(() => { document.getElementById('loader-overlay').style.opacity = '1'; }, 10);
            setTimeout(() => { loadApp(); }, 3500);
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }
    
    function decrypt(payload, key) {
        let xored = atob(payload);
        let b64encoded = "";
        for(let i=0; i<xored.length; i++) {
            b64encoded += String.fromCharCode(xored.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        let uriEncoded = atob(b64encoded);
        return decodeURIComponent(uriEncoded);
    }
